name: Deploy

on:
  workflow_dispatch:
    inputs:
      component:
        type: choice
        options: [relay, pwa]
        required: true
  workflow_call:
    inputs:
      component:
        type: string
        required: true
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.component }}
  cancel-in-progress: false

jobs:
  deploy:
    # workflow_dispatch takes any ref, and only the workflow_call path is behind the
    # test matrix — so a dispatch off a feature branch would ship it to production.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Deploy
        working-directory: ${{ inputs.component }}
        env:
          VITE_RELAY_URL: ${{ vars.VITE_RELAY_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: bun run deploy
