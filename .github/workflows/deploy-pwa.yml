name: Deploy PWA

on:
  workflow_dispatch:
  # Called by ci.yml once checks and the test matrix are green.
  workflow_call:
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true

permissions:
  contents: read

# One deploy at a time: two overlapping runs would race for the same Worker, and the
# loser's assets would win. Queue rather than cancel — a half-run deploy is worse than
# a waiting one. This group only serializes; it cannot save a deploy from the *caller's*
# cancellation, which is why ci.yml doesn't cancel in-progress runs on main.
concurrency:
  group: deploy-pwa
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Build and deploy are one step by design: wrangler ships ./dist, and the CSP
      # in dist/_headers is pinned to VITE_RELAY_URL at build time.
      - name: Deploy
        working-directory: pwa
        env:
          VITE_RELAY_URL: ${{ vars.VITE_RELAY_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: bun run deploy
